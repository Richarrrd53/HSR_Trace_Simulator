<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>星穹鐵道・行跡編輯器</title>
  <style>
:root {
    --header: 58px;
    --toolbar: 58px;
    --panel: 430px;
    --bg: #0b1430;
    --text: #f5f7ff;
    --muted: #aab8d4;
    --line: rgba(238, 244, 255, .74);
    --gold: #e2c477;

    /* 技能數值醒目顏色 */
    --color-highlight: #f29e38;

    /* 屬性傷害專屬顏色 */
    --color-lightning: #bc51da;  /* 雷屬性 */
    --color-wind: #5acb94;       /* 風屬性 */
    --color-ice: #55c5ff;        /* 冰屬性 */
    --color-fire: #e72727;       /* 火屬性 */
    --color-physical: #d3d3d3;   /* 物理屬性 */
    --color-imaginary: #f3e13b;  /* 虛數屬性 */
    --color-quantum: #5b57bd;    /* 量子屬性 */
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    cursor: url('../img/cursor.png'), auto;
}

body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--text);
    background: #091128;
}

button,
select,
input,
textarea {
    font: inherit
}

button,
select,
input,
textarea {
    outline: none
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column
}

.topbar {
    height: var(--header);
    flex: 0 0 var(--header);
    background: #101010;
    border-bottom: 1px solid #3c3c3c;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    z-index: 20;
}

.brand {
    font-weight: 900;
    font-size: 20px;
    margin-right: 10px;
    white-space: nowrap
}

.topbar select,
.topbar button,
.toolbar button,
.toolbar label {
    color: #f8f8f8;
    background: #202020;
    border: 1px solid #555;
    border-radius: 7px;
    height: 36px;
    padding: 0 11px;
    
}

.topbar select {
    min-width: 130px
}

.topbar button:hover,
.toolbar button:hover,
.toolbar label:hover {
    background: #303030
}

.spacer {
    flex: 1
}

.path-tag {
    color: #ead6a0;
    border: 1px solid #7d6739;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    letter-spacing: .12em
}

.toolbar {
    height: var(--toolbar);
    flex: 0 0 var(--toolbar);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: #121b36;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
    z-index: 18;
}

.toolbar .group {
    display: flex;
    gap: 8px;
    align-items: center
}

.toolbar .sep {
    width: 1px;
    height: 28px;
    background: rgba(255, 255, 255, .15);
    margin: 0 3px
}

.toolbar .status {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto
}

.workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden
}

.tree {
    position: absolute;
    inset: 0;
    background: url('../img/BG.png') no-repeat center center / cover;
    overflow: hidden;
}

.trace-group {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(84vh, 84vw, 820px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    transition: transform .35s cubic-bezier(.2, .75, .2, 1);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 2;
}

.tgbg{
    position: absolute;
    width: min(84vh, 84vw, 820px);
    height: min(84vh, 84vw, 820px);
    display: flex;
    align-items: center;
    justify-content: center;
}

.tgbg-1{
    width: 50%;
    aspect-ratio: 1;
    position: absolute;
    background: repeating-conic-gradient(
    #ffffff 0deg 1deg,
    transparent 1deg 4.5deg
    );
    border-radius: 999px;
    z-index: 0;
    filter: sepia() saturate(10) brightness(0.9) hue-rotate(156deg);
    opacity: 0.03;
}

.tgbg-2{
    position: absolute;
    width: 52%;
    aspect-ratio: 1;
    opacity: 0.03;
    filter: sepia() saturate(10) brightness(0.9) hue-rotate(156deg);
    border-radius: 999px;
    border: 5px solid #fff;
}

.tgbg-3{
    position: absolute;
    width: 100%;
    aspect-ratio: 1;
    background: radial-gradient(circle, #0080ff 10%, transparent 50%);
    opacity: 0.4;
    z-index: 2;
}

.tgbg .path-icon{
    position: absolute;
    width: 75%;
    opacity: 0.5;
    /* filter: sepia() saturate(8) brightness(0.5) hue-rotate(144deg); */
    z-index: 1;
    transition: scale 0.5s cubic-bezier(.4,0,.2,1);
    scale: 1;
}

.path-icon.animation{
    animation: path-icon 0.5s cubic-bezier(.4,0,.2,1);
}

@keyframes path-icon {
    from{
        scale: 1.1;
        opacity: 0.25;
    }
    to{
        scale: 1;
        opacity: 0.5;
    }
}

.path-icon.Destruction{
    width: 75%;
}

.path-icon.The_Hunt{
    width: 67%;
    transform: translate(0,7%);
}
.path-icon.Erudition{
    width: 73%;
    transform: translate(0,2.5%);
}

.path-icon.Harmony{
    width: 75%;
    transform: translate(0, 0%);
}

.path-icon.Nihility{
    width: 70%;
    transform: translate(0, 5%);
}

.path-icon.Preservation{
    width: 70%;
    transform: translate(0, 5%);
}

.path-icon.Abundance{
    width: 70%;
    transform: translate(0, 5%);
}

.path-icon.Remembrance{
    width: 80%;
    transform: translate(0, -1%);
}

.path-icon.Elation{
    width: 67%;
    transform: translate(0, 2%);
}

.tgbg-4{
    position: absolute;
    width: 90%;
    aspect-ratio: 1;
    opacity: 0.03;
    border-radius: 999px;
    border: 3px solid #fff;
}

.tgbg-5{
    position: absolute;
    width: 97%;
    aspect-ratio: 1;
    opacity: 0.03;
    border-radius: 999px;
    border: 4px solid #fff;
}

.tgbg-6,.tgbg-7{
    position: absolute;
    width: 20%;
    aspect-ratio: 18/3;
    background-image: radial-gradient(circle, #fff 20%, transparent 21%);
    background-size: 7% 50%;
    opacity: 0.3;
}

.tgbg-6{
    right: -20%;
}

.tgbg-7{
    left: -20%;
}

.tgbg-8{
    position: absolute;
    width: 150%;
    aspect-ratio: 1;
    border-radius: 999px;
    border: 3px solid #fff;
    opacity: 0.03;
}

.workspace.drawer-open .trace-group,
.tree.drawer-open .trace-group {
    transform: translate(calc(-50% - 190px), -50%);
}

.lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    overflow: visible;
}

.trace-line {
    stroke: rgba(238, 244, 255, .78);
    stroke-width: 4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.debug-point {
    fill: #ff4d4f;
    stroke: #fff;
    stroke-width: 1.5;
    pointer-events: none;
}

.debug-text {
    fill: #ffd666;
    font-size: 13px;
    font-weight: bold;
    text-anchor: middle;
    pointer-events: none;
}

.node {
    position: absolute;
    z-index: 4;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #f7f9ff;
    border: 2px solid #fff;
    color: #111b38;
    
    box-shadow: 0 0px 0px rgba(255, 255, 255, 0.3);
    transition: .15s;
}

.node:hover {
    transform: translate(-50%, -50%);
    filter: brightness(1.2);
    box-shadow: 0 0px 15px rgba(255, 255, 255, 0.5);
}

.node:active {
    filter: brightness(1);
    box-shadow: 0 0px 5px rgba(255, 255, 255, 0.5);

}

.node.major {
    width: 62px;
    height: 62px;
    background: #1e2137;
    border-color: rgba(255, 241, 205, 0.5);
    color: rgb(255, 241, 205);
    box-shadow: 0 0px 0px rgba(255, 255, 255, 0.3);
    border-width: 2px;
}

.node.major::after{
    content: '';
    position: absolute;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    opacity: 0;
    background: #fff;
    transition: .15s;
}

.node.major:hover{
    border-color: rgba(255, 241, 205, 1);
    filter: brightness(1);
}

.node.major:hover::after{
    opacity: 0.2;
}

.node.major:active::after{
    opacity: 0.05;
}


.node.elation{
    width: 62px;
    height: 62px;
    background: #1e2137;
    border-color: rgba(255, 173, 158, 0.5);
    color: rgb(255, 173, 158);
    box-shadow: 0 0px 0px rgba(255, 255, 255, 0.3);
    border-width: 2px;
}

.node.elation::after{
    content: '';
    position: absolute;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    opacity: 0;
    background: #fff;
    transition: .15s;
}

.node.elation:hover{
    border-color: rgba(255, 241, 205, 1);
    filter: brightness(1);
}

.node.elation:hover::after{
    opacity: 0.2;
}

.node.elation:active::after{
    opacity: 0.05;
}

.node.rememb{
    width: 62px;
    height: 62px;
    background: #1e2137;
    border-color: rgba(182, 182, 255, 0.5);
    color: rgb(182, 182, 255);
    box-shadow: 0 0px 0px rgba(255, 255, 255, 0.3);
    border-width: 2px;
}

.node.rememb::after{
    content: '';
    position: absolute;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    opacity: 0;
    background: #fff;
    transition: .15s;
}

.node.rememb:hover{
    border-color: rgba(255, 241, 205, 1);
    filter: brightness(1);
}

.node.rememb:hover::after{
    opacity: 0.2;
}

.node.rememb:active::after{
    opacity: 0.05;
}

.node.special {
    width: 66px;
    height: 66px;
}

.node.special::before{
    content: '';
    position: absolute;
    width: 130%;
    height: 130%;
    background: url('../img/node_special.png');
    background-size: 100% 100%;
}

.node.active {
    box-shadow: 0 0px 0px 2px rgba(255, 206, 98, 0.8), 0 0 10px 3px rgba(255, 206, 98, 0.5);
}

.node.active::before{
    content: '';
    width: 24px;
    height: 27px;
    background: url("../img/pointer.png");
    position: absolute;
    top: -27px;
    animation: pointer 1s cubic-bezier(.4,0,.2,1) infinite alternate-reverse;
}

@keyframes pointer {
    from{top: -37px;}
    to{top: -30px;}    
}


.node.major.active {
    border-color: rgba(255, 241, 205, 1);
    box-shadow: 0 0px 0px 3px rgba(255, 206, 98, 0.8), 0 0 10px 5px rgba(255, 206, 98, 0.5);
}

.node.special.active {
    border-color: rgba(255, 241, 205, 1);
    box-shadow: 0 0px 0px 3px rgba(255, 206, 98, 0.8), 0 0 10px 5px rgba(255, 206, 98, 0.5);
}

.node.special.active::after{
    content: '';
    position: absolute;
    width: 130%;
    height: 130%;
    background: url('../img/node_special.png');
    background-size: 100% 100%;
}

.node-icon {
    width: 72%;
    height: 72%;
    object-fit: contain;
    border-radius: 50%;
}

.node-placeholder {
    width: 52%;
    height: 52%;
    border: 1px dashed currentColor;
    border-radius: 50%;
    opacity: .5
}

.node-label {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 4px #000
}

.drawer {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: var(--panel);
    z-index: 12;
    transform: translateX(105%);
    transition: transform .28s cubic-bezier(.2, .75, .2, 1);
    display: flex;
    flex-direction: column;
}

.drawer.open {
    transform: translateX(0)
}

.drawer-tabs {
    height: 48px;
    display: flex;
    border-bottom: 1px solid rgba(255, 255, 255, .12)
}

.drawer-tabs button {
    flex: 1;
    background: transparent;
    border: 0;
    color: #aebbd3;
    
}

.drawer-tabs button.active {
    color: #fff;
    background: rgba(255, 255, 255, .07);
    box-shadow: inset 0 -2px #d7bd74
}

.drawer-body {
    padding: 20px;
    overflow: auto;
    flex: 1;
}

.node-view-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 18px;
}

.node-type-capsule {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #12192e;
    font-size: 13.5px;
    font-weight: 900;
    padding: 3px 16px;
    border-radius: 999px;
    letter-spacing: 1px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
}

.skill-card {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.skill-card:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.skill-head {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
}

.skill-preview {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: 1px dashed rgba(255, 255, 255, .3);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex: none;
    background: rgba(255, 255, 255, 0.05);
}

.skill-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.skill-name {
    font-size: 24px;
    font-weight: 850;
    color: #ffffff;
    letter-spacing: 0.5px;
}

.skill-subrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    min-height: 26px;
}

.skill-tag {
    color: #e5c687;
    font-size: 16px;
    font-weight: 750;
    letter-spacing: 0.5px;
}

.skill-energy-badge {
    background: rgba(255, 255, 255, 0.16);
    color: #edf2ff;
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.skill-toughness-bar {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    padding: 6px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 12px;
}

.toughness-label {
    color: #eef3ff;
    font-size: 15px;
    font-weight: 700;
}

.toughness-val {
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
}

.skill-desc {
    line-height: 1.8;
    color: #e2ebfa;
    font-weight: bold;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
}

.text-highlight {
    color: var(--color-highlight);
    font-weight: 900;
}

.elem-lightning {
    color: var(--color-lightning);
    font-weight: 900;
}

.elem-wind {
    color: var(--color-wind);
    font-weight: bold;
}

.elem-ice {
    color: var(--color-ice);
    font-weight: bold;
}

.elem-fire {
    color: var(--color-fire);
    font-weight: bold;
}

.elem-physical {
    color: var(--color-physical);
    font-weight: bold;
}

.elem-imaginary {
    color: var(--color-imaginary);
    font-weight: bold;
}

.elem-quantum {
    color: var(--color-quantum);
    font-weight: bold;
}

.edit-skill-block {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
}

.edit-skill-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.skill-index-badge {
    font-size: 13px;
    font-weight: 800;
    color: #d7bd74;
    text-transform: uppercase;
}

.btn-delete-skill {
    background: rgba(237, 69, 60, 0.2);
    border: 1px solid rgba(237, 69, 60, 0.5);
    color: #ff918c;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 12px;
    cursor: pointer;
}

.btn-delete-skill:hover {
    background: rgba(237, 69, 60, 0.35);
}

.btn-add-skill {
    width: 100%;
    height: 38px;
    border: 1px dashed #586b8c;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.05);
    color: #b7cbef;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: .15s;
}

.btn-add-skill:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    border-color: #7b97c4;
}

.edit-icon-thumb {
    margin-top: 6px;
    width: 38px;
    height: 38px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.edit-icon-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.empty-note {
    color: #8391ad;
    font-size: 13px
}

.form-row {
    margin-bottom: 14px
}

.form-row label {
    display: block;
    color: #c7d1e5;
    font-size: 12px;
    margin-bottom: 6px
}

.form-row input,
.form-row textarea,
.form-row select {
    width: 100%;
    color: #f4f7ff;
    background: #07142d;
    border: 1px solid #425474;
    border-radius: 7px;
    padding: 9px 10px
}

.form-row textarea {
    min-height: 120px;
    resize: vertical
}

.filebox {
    display: flex;
    gap: 8px;
    align-items: center
}

.filebox input[type=file] {
    padding: 7px
}

.row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px
}

.edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px
}

.edit-actions button {
    flex: 1;
    height: 38px;
    border-radius: 7px;
    border: 1px solid #586b8c;
    background: #1d3157;
    color: white;
    
}

.panel-title {
    font-size: 12px;
    color: #8fa0bf;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: .14em
}

.character-modal {
    position: absolute;
    inset: 0;
    background: #050911bb;
    z-index: 30;
    display: none;
    place-items: center
}

.character-modal.open {
    display: grid
}

.modal-card {
    width: min(520px, 90vw);
    background: #111d38;
    border: 1px solid #496082;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 25px 70px #0009
}

.modal-card h3 {
    margin: 0 0 14px
}

.modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px
}

.modal-actions button {
    height: 36px;
    padding: 0 14px;
    border: 1px solid #536789;
    border-radius: 7px;
    background: #21365d;
    color: white;
    
}

.corner-hint {
    position: absolute;
    left: 16px;
    bottom: 14px;
    z-index: 8;
    font-size: 12px;
    color: #afbdd5;
    background: #071127b8;
    padding: 8px 10px;
    border-radius: 7px
}

.hidden {
    display: none !important
}

@media(max-width:900px) {
    :root {
        --panel: min(92vw, 430px)
    }

    .workspace.drawer-open .trace-group,
    .tree.drawer-open .trace-group {
        transform: translate(-50%, -50%);
        opacity: .35;
    }

    .brand {
        font-size: 16px
    }

    .topbar {
        overflow-x: auto
    }

    .toolbar {
        overflow-x: auto
    }

    .toolbar .status {
        display: none
    }
}
</style>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">行跡模擬器</div>
      <select id="pathSelect" title="切換命途"></select>
      <select id="characterSelect" title="切換角色"></select>
      <button id="addCharacterBtn">＋角色</button>
      <div class="spacer"></div>

function tracePoint(xPercent, yPercent) {
    return {
        x: Number(xPercent) * 10,
        y: Number(yPercent) * 10
    };
}

function getNodePoint(node) {
    return tracePoint(node[2], node[3]);
}

function makeEdgePath(edge, byId) {
    const a = byId[edge.from];
    const b = byId[edge.to];

    if (!a || !b) return null;

    const p1 = getNodePoint(a);
    const p2 = getNodePoint(b);

    if (edge.type === "line" || !edge.type) {
        return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    }

    if (edge.type === "curve") {
        const control = tracePoint(edge.control[0], edge.control[1]);
        return `M ${p1.x} ${p1.y} Q ${control.x} ${control.y} ${p2.x} ${p2.y}`;
    }

    if (edge.type === "bezier") {
        const c1 = tracePoint(edge.c1[0], edge.c1[1]);
        const c2 = tracePoint(edge.c2[0], edge.c2[1]);
        return `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
    }

    return null;
}

function renderDebugPoint(svg, point, label) {
    const pt = tracePoint(point[0], point[1]);
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", pt.x);
    circle.setAttribute("cy", pt.y);
    circle.setAttribute("r", 5);
    circle.setAttribute("class", "debug-point");
    svg.appendChild(circle);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", pt.x);
    text.setAttribute("y", pt.y - 7);
    text.setAttribute("class", "debug-text");
    text.textContent = label;
    svg.appendChild(text);
}

            ["basic", "普攻", 230/7, 396/7, "major"], ["ult", "終結技", 50, 366/7, "major"], ["skill", "戰技", 472/7, 396/7, "major"],
            ["upperL", "屬性加成", 138/7, 302/7, "minor"], ["upperR", "屬性加成", 562/7, 302/7, "minor"],
            ["lowL1", "屬性加成", 78/7, 486/7, "minor"], ["lowL2", "屬性加成", 138/7, 548/7, "minor"],
            ["lowR1", "屬性加成", 622/7, 486/7, "minor"], ["lowR2", "屬性加成", 562/7, 548/7, "minor"],
            ["tech", "秘技", 50, 486/7, "major"], ["bottom", "屬性加成", 50, 578/7, "minor"], ["extraL", "額外能力", 198/7, 608/7, "special"], ["extraR", "額外能力", 502/7, 608/7, "special"]
        ],
        edges: [
            { from: "tl", to: "tr", type: "curve", control: [50, 30/7] },
            { from: "top", to: "bottom", type: "line" },
            { from: "basic", to: "skill", type: "curve", control: [50, 336/7] },
            { from: "extraL", to: "extraR", type: "curve", control: [50, 548/7] },
            { from: "lowL1", to: "extraL", type: "line" },
            { from: "lowR1", to: "extraR", type: "line" },
            { from: "basic", to: "upperL", type: "line" },
            { from: "skill", to: "upperR", type: "line" },
        ]
    }
};

function fieldsForPath(path) {
    if (path === "記憶") return MEMORY_TYPES;
    if (path === "歡愉") return ELATION_TYPES;
    return STANDARD_TYPES;
}

function defaultNodeData(tuple) {
    return {
        id: tuple[0],
        type: tuple[1],
        name: "",
        description: "",
        icon: "",
        tag: "",
        energy: "",
        toughness: "",
        skills: [
            { name: "", description: "", icon: "", tag: "", energy: "", toughness: "" }
        ]
    };
}
function freshCharacter(name, path) {
    const nodes = {};
    layouts[path].nodes.forEach(n => { if (n[4] !== "junction") nodes[n[0]] = defaultNodeData(n) });
    return { id: "ch_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8), name, path, background: "", nodes };
}

let appState = {
    version: 4,
    currentCharacterId: "default-destruction",
    characters: [freshCharacter("示範角色・毀滅", "毀滅")]
};
appState.characters[0].id = "default-destruction";

const $ = s => document.querySelector(s);
const tree = $("#tree"), drawer = $("#drawer"), traceGroup = $("#traceGroup");
const viewPane = $("#viewPane"), editPane = $("#editPane");
let selectedNodeId = null;

function currentCharacter() {
    return appState.characters.find(c => c.id === appState.currentCharacterId) || appState.characters[0];
}
function ensurePathNodes(c) {
    const template = layouts[c.path];
    const allowed = new Set(template.nodes.filter(n => n[4] !== "junction").map(n => n[0]));
    for (const t of template.nodes) {
        if (t[4] === "junction") continue;
        if (!c.nodes[t[0]]) c.nodes[t[0]] = defaultNodeData(t);
        const node = c.nodes[t[0]];
        node.type = node.type || t[1];
        if (!node.skills || !Array.isArray(node.skills) || node.skills.length === 0) {
            node.skills = [{
                name: node.name || "",
                description: node.description || "",
                icon: node.icon || "",
                tag: node.tag || "",
                energy: node.energy || "",
                toughness: node.toughness || ""
            }];
        }
    }
    Object.keys(c.nodes).forEach(k => { if (!allowed.has(k)) delete c.nodes[k] });
}
function initSelects() {
    $("#pathSelect").innerHTML = PATHS.map(p => `<option>${p}</option>`).join("");
    $("#newCharacterPath").innerHTML = $("#pathSelect").innerHTML;
    refreshCharacterSelect();
}
function refreshCharacterSelect() {
    const c = currentCharacter();
    $("#characterSelect").innerHTML = appState.characters.map(x => `<option value="${x.id}">${escapeHTML(x.name)}</option>`).join("");
    $("#characterSelect").value = c.id;
    $("#pathSelect").value = c.path;
    $("#pathTag").textContent = c.path;
}
function escapeHTML(s = "") { return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])) }
function nodeTuple(id) { return layouts[currentCharacter().path].nodes.find(n => n[0] === id) }

function formatSkillDescription(text = "") {
    if (!text) return "";
    let escaped = escapeHTML(text);

    // 1. Highlight slash values like 20%/40%, 100/200, 1.5%/3.0%, +20%/+40% (uses var(--color-highlight))
    escaped = escaped.replace(/(?:(?:\+|-)?\d+(?:\.\d+)?%?\s*\/\s*)+(?:\+|-)?\d+(?:\.\d+)?%?/g, match => {
        return `<span class="text-highlight">${match}</span>`;
    });

    // 2. Element damage colors (uses var(--color-*) defined in :root)
    const elementClassMap = {
        "雷屬性": "elem-lightning", "雷属性": "elem-lightning",
        "風屬性": "elem-wind", "风属性": "elem-wind",
        "冰屬性": "elem-ice", "冰属性": "elem-ice",
        "火屬性": "elem-fire", "火属性": "elem-fire",
        "物理屬性": "elem-physical", "物理属性": "elem-physical",
        "虛數屬性": "elem-imaginary", "虚数属性": "elem-imaginary",
        "量子屬性": "elem-quantum", "量子属性": "elem-quantum"
    };

    const elemPattern = /(雷[屬属]性|風[屬属]性|风[屬属]性|冰[屬属]性|火[屬属]性|物理[屬属]性|虛數[屬属]性|虚数[屬属]性|量子[屬属]性)(?=(?:[屬属]性)?(?:傷害|伤害))/g;

    escaped = escaped.replace(elemPattern, (match) => {
        const cls = elementClassMap[match] || "elem-lightning";
        return `<span class="${cls}">${match}</span>`;
    });

    return escaped;
}

function renderTree() {
    const c = currentCharacter(); ensurePathNodes(c);
    const tg = $("#traceGroup");
    const pathIcon = $("#path-icon");
    tg.querySelectorAll(".node").forEach(n => n.remove());

    const bgUrl = c.background || (c.path ? `${img_dic[c.path]}` : "");
    if (pathIcon){
        pathIcon.src = bgUrl ? `./img/${bgUrl}` : "none";
        pathIcon.className = `path-icon ${img_dic[c.path].split('.')[0].replace('Path_', '')}`
        pathIcon.classList.remove('animation');
        pathIcon.classList.add('animation');
        setTimeout(() => {
            pathIcon.classList.remove('animation');
            
        }, 500);
    } 

    const lines = document.getElementById("lines");
    if (lines) {
        lines.innerHTML = "";
        const layout = layouts[c.path];
        const byId = Object.fromEntries(layout.nodes.map(node => [node[0], node]));
        if (!byId.tl && byId.topL) byId.tl = byId.topL;
        if (!byId.tr && byId.topR) byId.tr = byId.topR;
        if (!byId.top && byId.topC) byId.top = byId.topC;
        if (!byId.l1 && byId.upperL) byId.l1 = byId.upperL;
        if (!byId.r1 && byId.upperR) byId.r1 = byId.upperR;
        if (!byId.extraL && byId.tech) byId.extraL = byId.tech;

        if (layout.edges && Array.isArray(layout.edges)) {
            layout.edges.forEach(edge => {
                const d = makeEdgePath(edge, byId);
                if (!d) return;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", "trace-line");
                lines.appendChild(path);

                if (DEBUG_TRACE) {
                    if (edge.type === "curve" && edge.control) {
                        renderDebugPoint(lines, edge.control, "C");
                    } else if (edge.type === "bezier") {
                        if (edge.c1) renderDebugPoint(lines, edge.c1, "C1");
                        if (edge.c2) renderDebugPoint(lines, edge.c2, "C2");
                    }
                }
            });
        }
    }

    layouts[c.path].nodes.forEach(t => {
        if (t[4] === "junction") return;
        const d = c.nodes[t[0]];
        const el = document.createElement("div");
        el.className = "node " + (t[4] === "major" ? "major" : t[4] === "special" ? "special" : t[4] === "elation" ? "elation" : t[4] === "rememb" ? "rememb" : "");
        el.style.left = t[2] + "%";
        el.style.top = t[3] + "%";
        el.dataset.id = t[0];
        const primaryIcon = (d.skills && d.skills[0] && d.skills[0].icon) || d.icon;
        el.innerHTML = primaryIcon
            ? `<img class="node-icon" src="${primaryIcon}" alt="">`
            : `<span class="node-placeholder"></span>`;
        if (t[4] !== "minor") el.insertAdjacentHTML("beforeend", `<span class="node-label">${escapeHTML(d.type)}</span>`);
        el.addEventListener("click", e => { e.stopPropagation(); selectNode(t[0]) });
        tg.appendChild(el);
    });
    if (selectedNodeId && c.nodes[selectedNodeId]) selectNode(selectedNodeId, false); else closeDrawer();
}
function selectNode(id, open = true) {
    selectedNodeId = id;
    const tg = $("#traceGroup");
    tg.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.id === id));
    renderView(); renderEdit();
    if (open) {
        drawer.classList.add("open");
        tree.classList.add("drawer-open");
    }
}
function closeDrawer() {
    selectedNodeId = null;
    drawer.classList.remove("open");
    tree.classList.remove("drawer-open");
    const tg = $("#traceGroup");
    if (tg) tg.querySelectorAll(".node").forEach(n => n.classList.remove("active"));
}
function renderView() {
    const c = currentCharacter(), d = c.nodes[selectedNodeId];
    if (!d) { viewPane.innerHTML = ""; return }

    const skills = (d.skills && Array.isArray(d.skills) && d.skills.length > 0) ? d.skills : [{
        name: d.name || "",
        description: d.description || "",
        icon: d.icon || "",
        tag: d.tag || "",
        energy: d.energy || "",
        toughness: d.toughness || ""
    }];

    const headerHTML = `
      <div class="node-view-header">
        <div class="node-type-capsule">${escapeHTML(d.type || "技能")}</div>
      </div>
    `;

    const cardsHTML = skills.map((skill, index) => {
        const rawName = (skill.name || "").trim();
        const displayName = rawName || "未命名技能";
        const rawTag = (skill.tag || "").trim();
        const displayTag = rawTag ? (rawTag.startsWith("[") ? rawTag : `[${rawTag}]`) : `[${d.type || "技能"}]`;
        const iconSrc = skill.icon || d.icon;

        return `
        <div class="skill-card">
          <div class="skill-head">
            ${iconSrc ? `
              <div class="skill-preview">
                <img src="${iconSrc}" alt="">
              </div>
            ` : ""}
            <div class="skill-name">${escapeHTML(displayName)}</div>
          </div>

          <div class="skill-subrow">
            <div class="skill-tag">${escapeHTML(displayTag)}</div>
            ${skill.energy ? `<div class="skill-energy-badge">能量恢復: ${escapeHTML(skill.energy)}</div>` : ""}
          </div>

          ${skill.toughness ? `
            <div class="skill-toughness-bar">
              <span class="toughness-label">削韌值</span>
              <span class="toughness-val">${escapeHTML(skill.toughness)}</span>
            </div>
          ` : ""}

          <div class="skill-desc">${formatSkillDescription(skill.description || "技能敘述尚未填寫。")}</div>
        </div>
        `;
    }).join("");

    viewPane.innerHTML = headerHTML + cardsHTML;
}
function saveFormToMemory(d) {
    if (!editPane || !d.skills) return;
    d.skills.forEach((skill, i) => {
        const nameInput = editPane.querySelector(`.f-skill-name[data-index="${i}"]`);
        const tagInput = editPane.querySelector(`.f-skill-tag[data-index="${i}"]`);
        const energyInput = editPane.querySelector(`.f-skill-energy[data-index="${i}"]`);
        const toughnessInput = editPane.querySelector(`.f-skill-toughness[data-index="${i}"]`);
        const descInput = editPane.querySelector(`.f-skill-desc[data-index="${i}"]`);

        if (nameInput) skill.name = nameInput.value;
        if (tagInput) skill.tag = tagInput.value;
        if (energyInput) skill.energy = energyInput.value;
        if (toughnessInput) skill.toughness = toughnessInput.value;
        if (descInput) skill.description = descInput.value;
    });
}
function renderEdit() {
    const c = currentCharacter(), d = c.nodes[selectedNodeId];
    if (!d) { editPane.innerHTML = ""; return }
    const types = fieldsForPath(c.path);

    if (!d.skills || !Array.isArray(d.skills) || d.skills.length === 0) {
        d.skills = [{
            name: d.name || "",
            description: d.description || "",
            icon: d.icon || "",
            tag: d.tag || "",
            energy: d.energy || "",
            toughness: d.toughness || ""
        }];
    }

    const skillsHTML = d.skills.map((skill, i) => `
        <div class="edit-skill-block" data-index="${i}">
            <div class="edit-skill-header">
                <span class="skill-index-badge">技能 #${i + 1}</span>
                ${d.skills.length > 1 ? `<button type="button" class="btn-delete-skill" data-del-index="${i}">刪除此技能</button>` : ""}
            </div>
            <div class="form-row">
                <label>技能名稱</label>
                <input class="f-skill-name" data-index="${i}" value="${escapeHTML(skill.name)}" placeholder="例如：盡情取悅本王吧">
            </div>
            <div class="form-row">
                <label>技能圖示（以 Data URL 存入 JSON）</label>
                <div class="filebox">
                    <input type="file" class="f-skill-icon-file" data-index="${i}" accept="image/*">
                    <button type="button" class="btn-clear-icon" data-index="${i}">清除</button>
                </div>
                ${skill.icon ? `<div class="edit-icon-thumb"><img src="${skill.icon}" alt="預覽"></div>` : ""}
            </div>
            <div class="form-row">
                <label>技能標籤 / 類型補充</label>
                <input class="f-skill-tag" data-index="${i}" value="${escapeHTML(skill.tag)}" placeholder="例如：群攻、強化、單攻">
            </div>
            <div class="row2">
                <div class="form-row">
                    <label>能量恢復</label>
                    <input class="f-skill-energy" data-index="${i}" value="${escapeHTML(skill.energy)}" placeholder="例如：10">
                </div>
                <div class="form-row">
                    <label>削韌值</label>
                    <input class="f-skill-toughness" data-index="${i}" value="${escapeHTML(skill.toughness)}" placeholder="例如：20">
                </div>
            </div>
            <div class="form-row">
                <label>技能敘述（數值如 20%/40% 自動橘色顯示，屬性傷害如 雷屬性傷害 自動著色）</label>
                <textarea class="f-skill-desc" data-index="${i}" placeholder="輸入技能效果...">${escapeHTML(skill.description)}</textarea>
            </div>
        </div>
    `).join("");

    editPane.innerHTML = `
        <div class="panel-title">${escapeHTML(c.path)}・節點資料編輯</div>
        <div class="form-row"><label>節點類型</label>
            <select id="fType">${types.map(x => `<option ${x === d.type ? "selected" : ""}>${x}</option>`).join("")}</select>
        </div>
        <div class="edit-skills-container">
            ${skillsHTML}
        </div>
        <button type="button" id="btnAddSkill" class="btn-add-skill">＋ 新增技能項目</button>
        <div class="edit-actions">
            <button id="saveSkill">套用變更</button>
        </div>
    `;

    $("#btnAddSkill").onclick = () => {
        saveFormToMemory(d);
        d.skills.push({ name: "", description: "", icon: "", tag: "", energy: "", toughness: "" });
        renderEdit();
    };

    editPane.querySelectorAll(".btn-delete-skill").forEach(btn => {
        btn.onclick = (e) => {
            const idx = parseInt(e.target.dataset.delIndex, 10);
            saveFormToMemory(d);
            if (d.skills.length > 1) {
                d.skills.splice(idx, 1);
                renderEdit();
            }
        };
    });

    editPane.querySelectorAll(".f-skill-icon-file").forEach(input => {
        input.onchange = (e) => {
            const idx = parseInt(e.target.dataset.index, 10);
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = () => {
                saveFormToMemory(d);
                d.skills[idx].icon = r.result;
                renderEdit();
                setStatus("技能圖示已加入");
            };
            r.readAsDataURL(file);
        };
    });

    editPane.querySelectorAll(".btn-clear-icon").forEach(btn => {
        btn.onclick = (e) => {
            const idx = parseInt(e.target.dataset.index, 10);
            saveFormToMemory(d);
            d.skills[idx].icon = "";
            renderEdit();
        };
    });

    $("#saveSkill").onclick = () => {
        saveFormToMemory(d);
        d.type = $("#fType").value;
        if (d.skills.length > 0) {
            d.name = d.skills[0].name;
            d.icon = d.skills[0].icon;
            d.tag = d.skills[0].tag;
            d.energy = d.skills[0].energy;
            d.toughness = d.skills[0].toughness;
            d.description = d.skills[0].description;
        }
        renderTree();
        selectNode(d.id);
        switchTab("view");
        setStatus("技能資料已更新");
    };
}
function switchTab(tab) {
    const edit = tab === "edit";
    $("#viewTab").classList.toggle("active", !edit); $("#editTab").classList.toggle("active", edit);
    viewPane.classList.toggle("hidden", edit); editPane.classList.toggle("hidden", !edit);
}
function setStatus(s) { $("#status").textContent = s; clearTimeout(setStatus.t); setStatus.t = setTimeout(() => $("#status").textContent = "點擊節點查看；點擊背景收起面板", 2600) }

$("#viewTab").onclick = () => switchTab("view");
$("#editTab").onclick = () => switchTab("edit");
$("#editSelectedBtn").onclick = () => {
    if (!selectedNodeId) { setStatus("請先選擇一個行跡節點"); return }
    drawer.classList.add("open");
    tree.classList.add("drawer-open");
    switchTab("edit");
};
tree.addEventListener("click", e => {
    if (e.target.closest(".node")) return;
    closeDrawer();
});
$("#pathSelect").onchange = e => {
    const c = currentCharacter();
    c.path = e.target.value;
    c.nodes = {};
    c.background = "";
    ensurePathNodes(c);
    selectedNodeId = null;
    refreshCharacterSelect();
    renderTree();
    setStatus("已切換命途並載入對應排布");
};
$("#characterSelect").onchange = e => {
    appState.currentCharacterId = e.target.value; selectedNodeId = null; refreshCharacterSelect(); renderTree(); closeDrawer();
};
$("#addCharacterBtn").onclick = () => $("#characterModal").classList.add("open");
$("#cancelAddCharacter").onclick = () => $("#characterModal").classList.remove("open");
$("#confirmAddCharacter").onclick = () => {
    const name = $("#newCharacterName").value.trim() || "未命名角色", path = $("#newCharacterPath").value;
    const c = freshCharacter(name, path); appState.characters.push(c); appState.currentCharacterId = c.id;
    $("#newCharacterName").value = ""; $("#characterModal").classList.remove("open");
    refreshCharacterSelect(); renderTree(); setStatus("已新增角色");
};
$("#bgUpload").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader(); r.onload = () => { currentCharacter().background = r.result; renderTree(); setStatus("背景圖已更換") }; r.readAsDataURL(file);
};
$("#exportBtn").onclick = () => {
    const json = JSON.stringify(appState, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "trace-editor-data.json"; a.click(); URL.revokeObjectURL(url);
    setStatus("JSON 已匯出");
};
$("#importInput").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
        try {
            const data = JSON.parse(r.result);
            if (!data.characters || !Array.isArray(data.characters)) throw new Error();
            appState = data;
            if (!appState.currentCharacterId || !appState.characters.some(c => c.id === appState.currentCharacterId))
                appState.currentCharacterId = appState.characters[0].id;
            appState.characters.forEach(c => { c.nodes = c.nodes || {}; if (!PATHS.includes(c.path)) c.path = "毀滅"; ensurePathNodes(c) });
            selectedNodeId = null; refreshCharacterSelect(); renderTree(); closeDrawer(); setStatus("JSON 匯入完成");
        } catch { alert("無法讀取此 JSON，請確認檔案格式。") }
    }; r.readAsText(file);
};
$("#resetLayoutBtn").onclick = () => {
    if (!confirm("重設目前角色的行跡節點資料？技能文字與圖示也會清空。")) return;
    const c = currentCharacter(); c.nodes = {}; ensurePathNodes(c); selectedNodeId = null; renderTree(); closeDrawer(); setStatus("已重設目前命途");
};

initSelects(); refreshCharacterSelect(); renderTree();
</script>
